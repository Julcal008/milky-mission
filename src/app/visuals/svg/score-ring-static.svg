<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none">
  <style>
    .ring-orbit { animation: spinOrbit 6s linear 0s; transform-origin: 120px 120px; }
    @keyframes spinOrbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .ring-orbit { animation: none !important; }
    }
  </style>
  <defs>
    <linearGradient id="scoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd79a"/>
      <stop offset="55%" stop-color="#6ea8ff"/>
      <stop offset="100%" stop-color="#3ddc97"/>
    </linearGradient>
  </defs>
  <circle cx="120" cy="120" r="104" stroke="#223049" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle cx="120" cy="120" r="88" stroke="#131b2c" stroke-width="12"/>
  <circle cx="120" cy="120" r="88" stroke="url(#scoreGrad)" stroke-width="12" stroke-dasharray="440 553" stroke-linecap="round" transform="rotate(-90 120 120)"/>
  <circle cx="120" cy="120" r="70" stroke="#223049" stroke-width="1"/>
  <g class="ring-orbit">
    <circle cx="120" cy="16" r="4" fill="#6ea8ff"/>
    <circle cx="120" cy="16" r="8" stroke="#6ea8ff" stroke-opacity="0.4" stroke-width="1.5"/>
  </g>
</svg>
