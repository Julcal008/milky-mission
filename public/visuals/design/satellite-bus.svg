<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" fill="none">
  <defs>
    <linearGradient id="solarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131b2c"/>
      <stop offset="100%" stop-color="#0d1320"/>
    </linearGradient>
    <linearGradient id="busTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#223049"/>
      <stop offset="100%" stop-color="#131b2c"/>
    </linearGradient>
  </defs>

  <g opacity="0.35" pointer-events="none">
    <ellipse cx="300" cy="240" rx="220" ry="115" stroke="#223049" stroke-width="1.5" stroke-dasharray="6 6"/>
    <ellipse cx="300" cy="240" rx="150" ry="78" stroke="#6ea8ff" stroke-width="1"/>
  </g>

  <g id="solar" data-layer="solar" class="sat-layer" tabIndex="0" role="button" aria-label="Solar array subsystem">
    <polygon points="45,140 205,215 165,255 5,180" fill="url(#solarGrad)" stroke="#6ea8ff" stroke-width="2.2" stroke-linejoin="round"/>
    <line x1="85" y1="159" x2="45" y2="199" stroke="#6ea8ff" stroke-opacity="0.55" stroke-width="1.2"/>
    <line x1="125" y1="178" x2="85" y2="218" stroke="#6ea8ff" stroke-opacity="0.55" stroke-width="1.2"/>
    <line x1="165" y1="196" x2="125" y2="236" stroke="#6ea8ff" stroke-opacity="0.55" stroke-width="1.2"/>
    <line x1="25" y1="160" x2="185" y2="235" stroke="#ffd79a" stroke-opacity="0.45" stroke-width="1"/>
    <polygon points="435,195 595,270 555,310 395,235" fill="url(#solarGrad)" stroke="#6ea8ff" stroke-width="2.2" stroke-linejoin="round"/>
    <line x1="475" y1="214" x2="435" y2="254" stroke="#6ea8ff" stroke-opacity="0.55" stroke-width="1.2"/>
    <line x1="515" y1="233" x2="475" y2="273" stroke="#6ea8ff" stroke-opacity="0.55" stroke-width="1.2"/>
    <line x1="555" y1="251" x2="515" y2="291" stroke="#6ea8ff" stroke-opacity="0.55" stroke-width="1.2"/>
    <line x1="415" y1="215" x2="575" y2="290" stroke="#ffd79a" stroke-opacity="0.45" stroke-width="1"/>
    <line x1="185" y1="235" x2="235" y2="215" stroke="#f4e3c1" stroke-width="3"/>
    <line x1="365" y1="215" x2="415" y2="215" stroke="#f4e3c1" stroke-width="3"/>
  </g>

  <g id="bus" data-layer="bus" class="sat-layer" tabIndex="0" role="button" aria-label="Primary spacecraft structural bus">
    <polygon points="300,130 385,175 300,220 215,175" fill="url(#busTop)" stroke="#f4e3c1" stroke-width="2.2" stroke-linejoin="round"/>
    <polygon points="215,175 300,220 300,320 215,275" fill="#0d1320" stroke="#f4e3c1" stroke-width="2.2" stroke-linejoin="round"/>
    <polygon points="300,220 385,175 385,275 300,320" fill="#131b2c" stroke="#f4e3c1" stroke-width="2.2" stroke-linejoin="round"/>
    <polygon points="230,198 288,229 288,295 230,264" fill="#f5b84c" fill-opacity="0.24" stroke="#ffd79a" stroke-width="1.3"/>
    <polygon points="312,229 370,198 370,264 312,295" fill="#6ea8ff" fill-opacity="0.18" stroke="#6ea8ff" stroke-width="1.3"/>
  </g>

  <g id="payload" data-layer="payload" class="sat-layer" tabIndex="0" role="button" aria-label="Scientific payload instruments">
    <ellipse cx="300" cy="332" rx="34" ry="18" fill="#070a12" stroke="#c084fc" stroke-width="2.5"/>
    <ellipse cx="300" cy="332" rx="20" ry="10" fill="#c084fc" fill-opacity="0.38" stroke="#e9eef8" stroke-width="1.5"/>
    <polygon points="300,152 335,170 300,188 265,170" fill="#070a12" stroke="#c084fc" stroke-width="2.2"/>
    <circle cx="300" cy="170" r="7" fill="#c084fc"/>
  </g>

  <g id="comms" data-layer="comms" class="sat-layer" tabIndex="0" role="button" aria-label="High-gain communications dish and antennas">
    <line x1="300" y1="130" x2="300" y2="82" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="300" cy="76" rx="44" ry="20" fill="#131b2c" stroke="#2dd4bf" stroke-width="2.4"/>
    <ellipse cx="300" cy="76" rx="22" ry="9" fill="#2dd4bf" stroke-opacity="0.55" stroke-width="1.2"/>
    <line x1="300" y1="76" x2="300" y2="54" stroke="#ffd79a" stroke-width="2" stroke-linecap="round"/>
    <circle cx="300" cy="52" r="4" fill="#2dd4bf"/>
    <line x1="385" y1="175" x2="425" y2="145" stroke="#2dd4bf" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="425" cy="145" r="3.5" fill="#2dd4bf"/>
  </g>
</svg>
