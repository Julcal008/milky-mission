<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none">
  <style>
    .hotspot-ring { animation: hotspotPulse 2.5s ease-in-out infinite; transform-origin: 20px 20px; }
    @keyframes hotspotPulse {
      0%, 100% { transform: scale(0.92); opacity: 0.65; }
      50% { transform: scale(1.18); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .hotspot-ring { animation: none; }
    }
  </style>
  <circle class="hotspot-ring" cx="20" cy="20" r="15" stroke="#6ea8ff" stroke-width="1.75" stroke-dasharray="5 3"/>
  <circle cx="20" cy="20" r="9" fill="#0d1320" stroke="#f4e3c1" stroke-width="2"/>
  <path d="M20 16V24M16 20H24" stroke="#ffd79a" stroke-width="2" stroke-linecap="round"/>
</svg>
