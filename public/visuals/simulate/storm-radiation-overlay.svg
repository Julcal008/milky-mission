<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160" fill="none">
  <style>
    .rad-wave { animation: waveShift 5s ease-in-out infinite alternate; }
    @keyframes waveShift {
      0% { transform: translateX(-8px); opacity: 0.45; }
      100% { transform: translateX(8px); opacity: 0.85; }
    }
    @media (prefers-reduced-motion: reduce) {
      .rad-wave { animation: none; opacity: 0.65; }
    }
  </style>
  <g class="rad-wave" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
    <path d="M16 40c45-18 90 18 135 0s90-18 135 0 65 18 98 0" stroke-dasharray="6 6"/>
    <path d="M16 80c45-18 90 18 135 0s90-18 135 0 65 18 98 0"/>
    <path d="M16 120c45-18 90 18 135 0s90-18 135 0 65 18 98 0" stroke-dasharray="4 8"/>
  </g>
</svg>
